<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>PROJECTS - JOI CONSTRUCTION LTD</title>
  <style>
    :root {
      --bg-color: #121417;
      --card-bg: #1a1e24;
      --card-hover: #222831;
      --accent: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3642;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 3rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 860px; width: 100%; margin: 0 auto; }
    .nav-back { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 2rem; font-size: 0.95rem; }
    .nav-back:hover { text-decoration: underline; }
    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    p.desc { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
    
    .project-list { display: flex; flex-direction: column; gap: 0.85rem; }
    .project-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .project-item:hover {
      background-color: var(--card-hover);
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .item-left { display: flex; align-items: center; gap: 1rem; }
    .folder-icon { font-size: 1.3rem; }
    .project-title { font-weight: 600; font-size: 1.05rem; }
    .arrow { color: var(--accent); font-weight: 700; }
  </style>
</head>
