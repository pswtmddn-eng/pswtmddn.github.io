<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECTS - JOI CONSTRUCTION LTD</title>
  <style>
    :root {
      --bg-color: #121417;
      --card-bg: #1a1e24;
      --accent: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e3642;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 900px; width: 100%; margin: 0 auto; }
    .nav-back { display: inline-block; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 2rem; font-size: 0.95rem; }
    .nav-back:hover { text-decoration: underline; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    p.desc { color: var(--text-muted); margin-bottom: 2.5rem; }
    .content-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="./index.html" class="nav-back">&larr; Back to Home</a>
    <h1>PROJECTS</h1>
    <p class="desc">시공 프로젝트 현황, 레노베이션 사례 및 구조 도면 아카이브</p>
    <div class="content-box">
      <p>프로젝트 목록을 여기에 정리해 작성하세요.</p>
    </div>
  </div>
</body>
